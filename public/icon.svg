<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a46" />
      <stop offset="50%" stop-color="#12236b" />
      <stop offset="100%" stop-color="#1b2d86" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Industrial grid pattern subtle -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Central Graphic: High-tech Paint Sprayer & Gauge Emblem -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Outer Ring Gauge -->
    <circle cx="256" cy="245" r="148" fill="#131a31" stroke="rgba(255,255,255,0.1)" stroke-width="6" />
    <circle cx="256" cy="245" r="148" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="680" stroke-dashoffset="180" />

    <!-- Paint Spray Nozzle & Droplets -->
    <!-- Spray Gun Body -->
    <path d="M 210,180 L 290,180 L 290,210 L 245,235 L 245,295 L 225,295 L 225,235 L 210,210 Z" fill="#e2e8f0" />
    <!-- Spray Canister -->
    <rect x="235" y="140" width="65" height="40" rx="8" fill="url(#accentGrad)" />
    <!-- Nozzle Tip -->
    <polygon points="210,185 170,170 170,205" fill="#94a3b8" />
    <!-- Spray Atomization Mist Particles -->
    <path d="M 155,160 Q 110,135 70,140 Q 100,188 155,188 Z" fill="url(#accentGrad)" opacity="0.85" />
    <circle cx="115" cy="150" r="10" fill="#38bdf8" />
    <circle cx="85" cy="175" r="8" fill="#818cf8" />
    <circle cx="120" cy="180" r="7" fill="#34d399" />
    <circle cx="60" cy="155" r="6" fill="#a855f7" />

    <!-- Quality Check Shield Badge in bottom right of gauge -->
    <g transform="translate(295, 275) scale(0.95)">
      <polygon points="35,0 70,12 70,48 35,70 0,48 0,12" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />
      <path d="M 22,34 L 31,43 L 48,26" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Modern Car Silhouette under coating -->
    <path d="M 200,320 C 215,310 240,305 260,305 C 285,305 305,315 315,325 L 325,335 C 330,340 332,345 320,345 L 180,345 C 170,345 175,338 185,332 Z" fill="#64748b" opacity="0.6" />
  </g>

  <!-- Typography: BAXY PAINTSHOP -->
  <text x="256" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff" text-anchor="middle">BAXY PAINTSHOP</text>
  <text x="256" y="452" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#38bdf8" text-anchor="middle">ANDROID SYSTEM</text>
</svg>
