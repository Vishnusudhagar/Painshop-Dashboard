<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baxy Paintshop Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
:root{--bg:#0b0f1e;--card:#131a31;--line:#222b4a;--tx:#e8ecff;--mut:#8590b8;--a:#7c6cff;--g:#34d399;--o:#f59e0b;--r:#f43f5e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1b2250 0,var(--bg) 60%) fixed;color:var(--tx);font-family:system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:linear-gradient(100deg,#0a1a46,#12236b 60%,#1b2d86);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:14px;align-items:center}
.logo{font-size:38px;line-height:1;padding-right:14px;border-right:1px solid #ffffff44}
h1{margin:0;font-size:26px;letter-spacing:.04em;font-weight:800}
.nv{font-size:14px;color:#c9d4ff;margin-top:3px}
.logo{cursor:pointer}.logo img{height:54px;max-width:210px;object-fit:contain;display:block}
.tag{font-style:italic;color:#c9d4ff;font-size:15px}
.dt{display:flex;gap:10px;align-items:center}.dt .ic{font-size:30px}
.dt small{display:block;color:#aab8ee;font-size:12px}.dt b{font-size:18px}
.app{display:grid;grid-template-columns:210px 1fr}
nav{padding:14px 10px;border-right:1px solid var(--line);min-height:calc(100vh - 80px)}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;color:var(--mut);padding:12px 14px;border-radius:10px;font-size:15px;cursor:pointer;margin-bottom:4px}
nav button.on{background:var(--a);color:#fff;font-weight:600}
main{padding:14px 18px 40px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.live{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--g);margin-right:auto}
.live i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.live.off{color:var(--mut)}
.btn{background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13px}
.btn.alt{background:#1d2646;color:var(--tx)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.fl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fl label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.fl input[type=date]{width:100%;background:#1d2646;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px;font-size:13px;color-scheme:dark}
.fl select{width:100%;background:#1d2646;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:linear-gradient(135deg,var(--card) 35%,var(--cb));border:1px solid var(--line);border-top:3px solid var(--c);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.kpi[role=button]{cursor:pointer}
.kpi .row{display:flex;gap:12px;align-items:center}.kpi .em{font-size:38px}
.kpi .t{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:34px;font-weight:800;line-height:1.1}.kpi .v small{font-size:14px;color:var(--mut);margin-left:6px}
.kpi .d{border-top:1px solid #ffffff1c;padding-top:8px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.m{color:var(--mut);font-size:12px}
.prog{height:6px;border-radius:99px;background:#1d2646;overflow:hidden;flex:1;min-width:60px}.prog i{display:block;height:100%;background:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.w2{grid-column:span 2}
@media(max-width:860px){.w2{grid-column:span 1}.app{grid-template-columns:1fr}
 nav{display:flex;overflow-x:auto;gap:6px;padding:10px 14px;border-right:0;min-height:0;position:sticky;top:0;z-index:5;background:#0b0f1eee}
 nav button{width:auto;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 16px;margin:0}
 .tag{display:none}h1{font-size:22px}main{padding:12px 14px 40px}}
.pn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.pn h3{margin:0 0 10px;font-size:16px}
.ch{position:relative;height:290px}
.tw{overflow:auto;max-height:460px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
.tbl tr.tot td{font-weight:800;background:#18213f}
.g{color:var(--g)}.o{color:var(--o)}.r{color:var(--r)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle}
.lg{width:100%;font-size:14px;margin-top:8px;border-collapse:collapse}.lg td{padding:5px 2px}.lg td:last-child{text-align:right;color:var(--mut)}
.pill{padding:2px 8px;border-radius:999px;font-size:11px;background:#1d2646}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}
.empty{padding:30px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="hd">
  <div class="brand"><div class="logo" id="logo" title="Tap to change logo" onclick="document.getElementById('logoF').click()">🎨</div><input type="file" id="logoF" accept="image/*" hidden><div><h1>BAXY PAINTSHOP REPORT</h1><div class="nv">Production &nbsp;|&nbsp; Quality &nbsp;|&nbsp; Performance</div></div></div>
  <div class="tag">Better Coating &nbsp;•&nbsp; Better Quality &nbsp;•&nbsp; Higher Productivity</div>
  <div class="dt"><div class="ic">📅</div><div><small>Date</small><b id="today"></b><small id="lr"></small></div></div>
</div>

<div class="app">
  <nav id="side">
    <button data-p="overview" class="on">🏠 Overview</button>
    <button data-p="production">🏭 Production</button>
    <button data-p="quality">🛡️ Quality</button>
    <button data-p="defects">⚠️ Defects Analysis</button>
    <button data-p="trends">📈 Trends</button>
    <button data-p="reports">📄 Reports</button>
  </nav>
  <main>
    <div class="bar">
      <span class="live" id="pill"><i></i><span id="pillt">Sample data</span></span>
      <button class="btn" onclick="connectSheet()">🔗 Connect Sheet</button>
      <button class="btn alt" onclick="document.getElementById('f').click()">Upload Excel/CSV</button>
      <button class="btn alt" onclick="refreshNow()">⟳ Refresh</button>
      <input type="file" id="f" accept=".xlsx,.xls,.csv" hidden>
    </div>
    <div class="filters">
      <div class="fl"><label>Date Range</label><select id="fDate"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="last7">Last 7 days</option><option value="lastweek">Last week</option><option value="month" selected>This month</option><option value="all">All data</option><option value="lastmonth">Last month</option><option value="custom">Custom date range</option></select><div id="cust" style="display:none;gap:6px;margin-top:8px;flex-direction:column"><input type="date" id="dFrom"><input type="date" id="dTo"></div></div>
      <div class="fl"><label>Shift</label><select id="fShift"></select></div>
      <div class="fl"><label>Model</label><select id="fModel"></select></div>
      <div class="fl"><label>Line</label><select id="fLine"></select></div>
    </div>
    <div id="view"></div>
    <div class="note" id="note"></div>
  </main>
</div>

<script>
if(typeof Chart==='undefined'||typeof XLSX==='undefined'){document.addEventListener('DOMContentLoaded',()=>{document.getElementById('view').innerHTML='<div class="pn"><h3>⚠️ Libraries did not load</h3><div class="m">Chart.js / SheetJS could not be downloaded. Open this file in a browser (Chrome/Safari) with internet access, not in a file previewer.</div></div>'})}
/* ================= SETTINGS ================= */
let MONTHLY_TARGET=60000;          // click the green Monthly Target card to change
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vStOPoBnHm-C_F6quv4JItMXOk6DkeFnWd5anw1dUef76cCQt7fbOl8QjdfQcSukGsU_1auHWTQbaeU/pub?output=csv";
const REFRESH_SECONDS=60;
const shiftOf=h=>(h>=6&&h<14)?'A':(h>=14&&h<22)?'B':'C';   // A 06-14, B 14-22, C 22-06
const SHIFT_TXT={A:'06:00 - 14:00',B:'14:00 - 22:00',C:'22:00 - 06:00'};
const REJ_GREEN=3.5,REJ_AMBER=4.5;  // rejection % colour limits

/* ================= DATE HELPERS ================= */
var DATE_ORDER='DMY';
function parseStr(s){
  s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ]+(\d{1,2}):(\d{2}))?/);
  if(m)return{y:+m[1],mo:+m[2],d:+m[3],h:m[4]!=null?+m[4]:null};
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?)?/);
  if(m){const a=+m[1],b=+m[2];let d,mo;
    if(DATE_ORDER==='MDY'){mo=a;d=b}else{d=a;mo=b}
    let h=m[4]!=null?+m[4]:null;
    if(h!=null&&m[6]){const p=m[6].toLowerCase();if(p==='pm'&&h<12)h+=12;if(p==='am'&&h===12)h=0}
    let y=+m[3];if(y<100)y+=2000;return{y,mo,d,h}}
  const dt=new Date(s);
  return isNaN(dt)?null:{y:dt.getFullYear(),mo:dt.getMonth()+1,d:dt.getDate(),h:dt.getHours()};
}
function detectOrder(raw){
  const vals=[];
  for(const r of raw)for(const k in r){
    if(!/date|time/i.test(k))continue;
    const m=String(r[k]).match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
    if(m)vals.push([+m[1],+m[2],+m[3]]);
  }
  for(const[a,b]of vals){if(a>12){DATE_ORDER='DMY';return}if(b>12){DATE_ORDER='MDY';return}}
  /* every date is ambiguous (day<=12): pick the order that puts fewer dates in the future */
  const now=new Date(),fut=o=>vals.filter(([a,b,y])=>{y=y<100?2000+y:y;const mo=o==='MDY'?a:b,d=o==='MDY'?b:a;return new Date(y,mo-1,d)>now}).length;
  DATE_ORDER=fut('MDY')<fut('DMY')?'MDY':'DMY';
}
function keyOf(v){
  if(v===''||v==null)return null;
  if(typeof v==='string'&&/^\d+(\.\d+)?$/.test(v.trim()))v=parseFloat(v);
  if(typeof v==='number')return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);
  const p=parseStr(v);if(!p||p.mo<1||p.mo>12)return null;
  return p.y+'-'+String(p.mo).padStart(2,'0')+'-'+String(p.d).padStart(2,'0');
}
function shiftFrom(v){
  if(v===''||v==null)return '—';
  if(typeof v==='string'&&/^\d+(\.\d+)?$/.test(v.trim()))v=parseFloat(v);
  if(typeof v==='number')return shiftOf(Math.floor((v%1)*24));
  const p=parseStr(v);return p&&p.h!=null?shiftOf(p.h):'—';
}
const dn=k=>{const[a,b,c]=k.split('-').map(Number);return Date.UTC(a,b-1,c)/864e5};
const num=v=>{const s=String(v).replace(/,/g,'').trim();return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):0};
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dlab=k=>{const[a,b,c]=k.split('-');return c+'-'+MON[+b-1]};

/* ================= DATA ================= */
const DEFAULT_ROWS=[
{ID:7,Start:46309.906458333331,Date:46310,Line:"Powder Coating Line",Part:"H-321",Stage:"Loading",Load:200,Insp:0,OK:0,NOK:0,Defect:""},
{ID:8,Start:46309.907002314816,Date:46310,Line:"Powder Coating Line",Part:"H-321",Stage:"Unloading",Load:0,Insp:200,OK:195,NOK:5,Defect:"Dry/uncover;Rundown;"},
{ID:9,Start:46309.907256944447,Date:46310,Line:"Liquid Line",Part:"H-280",Stage:"Loading",Load:200,Insp:0,OK:0,NOK:0,Defect:""},
{ID:10,Start:46309.907418981478,Date:46310,Line:"Liquid Line",Part:"H-280",Stage:"Unloading",Load:0,Insp:200,OK:195,NOK:5,Defect:"Dry/uncover;Rundown;"}
].map(r=>({ID:r.ID,Line:r.Line,Part:r.Part,Stage:r.Stage,Load:r.Load,Insp:r.Insp,OK:r.OK,NOK:r.NOK,Rej:0,Rework:0,Defect:r.Defect,DateKey:keyOf(r.Date),Shift:shiftFrom(r.Start)}));

function normalize(raw){
  detectOrder(raw);
  const N=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  return raw.map(r=>{
    const keys=Object.keys(r).map(k=>[N(k),k]);
    const g=(...names)=>{for(const n of names){const f=keys.find(x=>x[0]===n);if(f&&String(r[f[1]]).trim()!=='')return r[f[1]]}return ''};
    const start=g('timestamp','starttime');let date=String(g('date')).trim();
    const tsKey=keyOf(start);
    if(/^\d{1,2}[\/.-]\d{1,2}$/.test(date))date+='/'+(tsKey?tsKey.slice(0,4):new Date().getFullYear());
    let dk=keyOf(date);
    if(!dk||dn(dk)>dn(localKey(new Date())))dk=tsKey||dk;
    const sh=String(g('shift')).trim();
    return{ID:g('id'),Line:String(g('line')).trim(),Part:String(g('partno','partno2','model','model1','model2','partnumber')).trim(),
      Stage:(st=>/\d[\/.-]\d/.test(st)?'':st)(String(g('stage')).trim()),
      Load:num(g('loadingqty','loadingquantity','loadqty')),Insp:num(g('totalinspectionqty','inspectionqty','inspectedqty')),
      OK:num(g('okpartqty','okqty','okparts')),NOK:num(g('notokpartqty','notokpart','notokqty')),Rework:num(g('totalreworkparts','totalreworkpart','totalreworkqty','reworkparts','reworkpart','reworkqty','totalrework','rework')),Rej:num(g('rejectedpart','rejectedpartqty','rejectedqty','rejectionqty')),
      Defect:String(g('defect','defects','defecttype','defect1','defects1')||''),DateKey:dk,
      Shift:sh?((sh.match(/([ABC])\s*$/i)||[])[1]||sh.charAt(0)).toUpperCase():shiftFrom(start)};
  }).map(r=>{if(!r.Insp&&(r.OK+r.NOK)>0)r.Insp=r.OK+r.NOK;   // Inspected fallback = OK + Not OK (before rework)
      r.NOK=Math.max(0,r.NOK-r.Rework);   // Not OK = Not OK Part - Total Rework Parts
      return r})
    .filter(r=>r.DateKey);
}

/* ================= STATE / FILTERS ================= */
const $=id=>document.getElementById(id);
const fDate=$('fDate'),fShift=$('fShift'),fModel=$('fModel'),fLine=$('fLine'),view=$('view'),note=$('note');
let ROWS=CSV_URL?[]:DEFAULT_ROWS,page='overview',USER_DATE=false;
function fillSel(el,vals){const cur=el.value;el.innerHTML='<option value="All">All</option>'+vals.map(v=>`<option>${v}</option>`).join('');el.value=[...el.options].some(o=>o.value===cur)?cur:'All'}
function setFilters(){
  const u=k=>[...new Set(ROWS.map(r=>r[k]).filter(v=>v&&v!=='—'))].sort();
  fillSel(fShift,u('Shift'));fillSel(fModel,u('Part'));fillSel(fLine,u('Line'));
}
const pad2=n=>String(n).padStart(2,'0');
const localKey=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const fromDn=d=>new Date(d*864e5).toISOString().slice(0,10);
function compute(){
  const sv=fShift.value,mv=fModel.value,lv=fLine.value;
  const b=ROWS.filter(r=>(sv==='All'||r.Shift===sv)&&(mv==='All'||r.Part===mv)&&(lv==='All'||r.Line===lv));
  const tk=localKey(new Date()),T=dn(tk),[y,m]=tk.split('-').map(Number),opt=fDate.value;
  let lo,hi,plo,phi,lbl;
  if(opt==='today'){lo=hi=T;plo=phi=T-1;lbl='vs yesterday'}
  else if(opt==='yesterday'){lo=hi=T-1;plo=phi=T-2;lbl='vs previous day'}
  else if(opt==='last7'){lo=T-6;hi=T;plo=lo-7;phi=lo-1;lbl='vs previous 7 days'}
  else if(opt==='lastweek'){const dow=(new Date(T*864e5).getUTCDay()+6)%7,mon=T-dow;lo=mon-7;hi=mon-1;plo=lo-7;phi=lo-1;lbl='vs previous week'}
  else if(opt==='lastmonth'){lo=Date.UTC(y,m-2,1)/864e5;hi=Date.UTC(y,m-1,0)/864e5;plo=Date.UTC(y,m-3,1)/864e5;phi=lo-1;lbl='vs previous month'}
  else if(opt==='all'){const ks=ROWS.map(r=>dn(r.DateKey));lo=ks.length?Math.min(...ks):T;hi=ks.length?Math.max(...ks):T;plo=lo-1;phi=lo-2;lbl='all data'}
  else if(opt==='custom'){
    const f=$('dFrom').value,t=$('dTo').value;lo=f?dn(f):T;hi=t?dn(t):T;if(hi<lo){const x=lo;lo=hi;hi=x}
    const n=hi-lo+1;plo=lo-n;phi=lo-1;lbl='vs previous period'}
  else{lo=Date.UTC(y,m-1,1)/864e5;hi=T;plo=Date.UTC(y,m-2,1)/864e5;phi=lo-1;lbl='vs last month'}
  const inR=(r,a,z)=>{const d=dn(r.DateKey);return d>=a&&d<=z};
  const lo2=Math.min(lo,hi-9);
  return{b,cur:b.filter(r=>inR(r,lo,hi)),prev:b.filter(r=>inR(r,plo,phi)),trend:b.filter(r=>inR(r,lo2,hi)),opt,lbl,lo,hi};
}
const sum=(rows,f)=>rows.reduce((a,r)=>a+r[f],0);
function grp(rows,kf){const m={};rows.forEach(r=>{const k=kf(r);m[k]=m[k]||{k,load:0,insp:0,ok:0,nok:0,rej:0,rw:0,n:0};m[k].load+=r.Load;m[k].insp+=r.Insp;m[k].ok+=r.OK;m[k].nok+=r.NOK;m[k].rej+=r.Rej||0;m[k].rw+=r.Rework||0;m[k].n++});const out=Object.values(m);out.forEach(o=>o.nok=Math.max(0,o.nok-o.rej));return out}
const rej=o=>o.insp?(o.rej||0)/o.insp*100:0;   // rejection % = Rejected Part / Inspected
const byKey=(a,b)=>a.k<b.k?-1:a.k>b.k?1:0;
const rc=p=>p<=REJ_GREEN?'g':p<=REJ_AMBER?'o':'r';
function defects(rows,top){
  const d={};rows.forEach(r=>{const t=r.Defect.split(/[;,]/).map(s=>s.trim()).filter(Boolean);if(!t.length||!r.NOK)return;t.forEach(n=>d[n]=(d[n]||0)+r.NOK/t.length)});
  let e=Object.entries(d).sort((a,b)=>b[1]-a[1]);
  if(top&&e.length>top+1){const rest=e.slice(top).reduce((a,x)=>a+x[1],0);e=[...e.slice(0,top),['Others',rest]]}
  return e;
}
const DCOL=['#3b82f6','#f97316','#22c55e','#a855f7','#facc15','#9ca3af'];

/* ================= CHART SETUP ================= */
Chart.defaults.color='#8590b8';Chart.defaults.borderColor='#222b4a';Chart.defaults.font.family='system-ui,Segoe UI,Roboto,sans-serif';Chart.defaults.animation=false;
Chart.register({id:'vl',afterDatasetsDraw(c,a,o){
  if(!o||!o.on)return;const x=c.ctx;x.save();x.fillStyle='#e8ecff';x.font='bold 12px system-ui';x.textAlign='center';
  c.getDatasetMeta(0).data.forEach((b,i)=>{const v=c.data.datasets[0].data[i];x.fillText((o.dec!=null?v.toFixed(o.dec):fmt(v))+(o.suffix||''),b.x,b.y-6)});x.restore()}});
Chart.register({id:'dp',afterDatasetsDraw(c,a,o){
  if(!o||!o.on)return;const x=c.ctx,m=c.getDatasetMeta(0),d=c.data.datasets[0].data,t=d.reduce((p,q)=>p+q,0);
  x.save();x.textAlign='center';x.textBaseline='middle';
  m.data.forEach((el,i)=>{if(!t||d[i]/t<.06)return;const p=el.tooltipPosition();x.fillStyle='#fff';x.font='bold 12px system-ui';x.fillText((d[i]/t*100).toFixed(1)+'%',p.x,p.y)});
  const cx=m.data[0]?m.data[0].x:c.width/2,cy=m.data[0]?m.data[0].y:c.height/2;
  x.fillStyle='#e8ecff';x.font='bold 24px system-ui';x.fillText(fmt(t),cx,cy-8);x.fillStyle='#8590b8';x.font='12px system-ui';x.fillText(o.label||'',cx,cy+14);x.restore()}});
const charts={};
const kill=()=>{for(const k in charts){try{charts[k].destroy()}catch(e){}delete charts[k]}};
const mk=(id,cfg)=>{const el=$(id);if(el)charts[id]=new Chart(el,cfg)};
const opt=(x={})=>({responsive:true,maintainAspectRatio:false,...x});
const yPct={beginAtZero:true,ticks:{callback:v=>v+'%'}};
const barOpt=(suffix)=>opt({layout:{padding:{top:20}},plugins:{legend:{display:false},vl:{on:true,dec:1,suffix:'%'}},scales:{y:yPct}});
const cv=(id,h)=>`<div class="ch"${h?` style="height:${h}px"`:''}><canvas id="${id}"></canvas></div>`;
function tbl(list,first){return '<div class="tw"><table class="tbl"><tr>'+[first,'Loaded','Inspected','OK','Rework','Rejection','Rej %'].map(h=>`<th>${h}</th>`).join('')+'</tr>'+
  list.map(o=>`<tr><td>${o.k}</td><td>${fmt(o.load)}</td><td>${fmt(o.insp)}</td><td class="g">${fmt(o.ok)}</td><td class="o">${fmt(o.rw)}</td><td class="r">${fmt(o.rej)}</td><td class="${rc(rej(o))}">${rej(o).toFixed(1)}%</td></tr>`).join('')+'</table></div>'}

/* ================= SHARED BLOCKS ================= */
function kpiHTML(c){
  const{cur,prev,opt:o}=c,okq=sum(cur,'OK'),rw=sum(cur,'Rework'),prod=okq+rw,rj=sum(cur,'Rej'),netNG=rows=>Math.max(0,sum(rows,'NOK')-sum(rows,'Rej')),ng=netNG(cur);
  const delta=f=>{if(!prev)return null;const g=f==='NOK'?netNG:f==='OK'?(rows=>sum(rows,'OK')+sum(rows,'Rework')):(rows=>sum(rows,f)),p=g(prev);return p?((g(cur)-p)/p*100):null};
  const lbl=c.lbl;
  const dl=(v,good)=>v==null?'<span class="m">no previous data</span>':`<span style="color:${(v>=0)===good?'#34d399':'#f43f5e'}">${v>=0?'▲':'▼'} <b>${v>=0?'+':''}${v.toFixed(1)}%</b></span><span class="m">${lbl}</span>`;
  const pct=MONTHLY_TARGET?prod/MONTHLY_TARGET*100:0;
  const K=(col,bg,em,t,v,d,extra='')=>`<div class="kpi" style="--c:${col};--cb:${bg}"${extra}><div class="row"><div class="em">${em}</div><div><div class="t">${t}</div><div class="v">${v}<small>Nos</small></div></div></div><div class="d">${d}</div></div>`;
  return '<div class="kpis">'+
   K('#22c55e','#0f3d33','🎯','Monthly Target',fmt(MONTHLY_TARGET),`<b>${pct.toFixed(1)}%</b><span class="m">achieved</span><div class="prog"><i style="width:${Math.min(pct,100)}%"></i></div>`,' onclick="editTarget()" title="Click to edit target" role="button"')+
   K('#3b82f6','#14307a','📦','Total Production',fmt(prod),dl(delta('OK'),true)+`<span class="m" style="width:100%">OK ${fmt(okq)} + Rework ${fmt(rw)}</span>`)+
   K('#f59e0b','#4a3510','🔧','Rework Parts Qty',fmt(rw),dl(delta('Rework'),true)+`<span class="m" style="width:100%">included in Total Production</span>`)+
   K('#f43f5e','#4a1522','❌','Rejected Part Qty',fmt(rj),dl(delta('Rej'),false))+'</div>';
}
function shiftTable(rows){
  const g=grp(rows,r=>r.Shift).sort(byKey),t=grp(rows,()=>'T')[0]||{insp:0,ok:0,nok:0,rw:0};
  return '<div class="tw"><table class="tbl"><tr><th>Shift</th><th>Total Production</th><th>OK</th><th>Rework</th><th>Rejection %</th></tr>'+
   g.map(o=>`<tr><td><b>${o.k}</b> <span class="m">${SHIFT_TXT[o.k]?'('+SHIFT_TXT[o.k]+')':''}</span></td><td>${fmt(o.ok+o.rw)}</td><td>${fmt(o.ok)}</td><td class="o">${fmt(o.rw)}</td><td class="${rc(rej(o))}"><b>${rej(o).toFixed(1)}%</b></td></tr>`).join('')+
   `<tr class="tot"><td>Total</td><td>${fmt(t.ok+t.rw)}</td><td>${fmt(t.ok)}</td><td>${fmt(t.rw)}</td><td class="${rc(rej(t))}">${rej(t).toFixed(1)}%</td></tr></table></div>`;
}
function donut(id,rows,top){
  const e=defects(rows,top),tot=e.reduce((a,x)=>a+x[1],0);
  mk(id,{type:'doughnut',data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>x[1]),backgroundColor:DCOL,borderColor:'#131a31',borderWidth:2}]},options:opt({cutout:'52%',plugins:{legend:{display:false},dp:{on:true,label:'Defects'}}})});
  return '<table class="lg">'+(e.map((x,i)=>`<tr><td><span class="dot" style="background:${DCOL[i%6]}"></span>${x[0]}</td><td>${tot?(x[1]/tot*100).toFixed(1):0}%</td></tr>`).join('')||'<tr><td>No defects in range</td></tr>')+'</table>';
}

function load(raw){
  const rows=normalize(raw);
  if(!rows.length){render();note.textContent='Connected, but 0 usable rows found ('+raw.length+' rows read; columns: '+Object.keys(raw[0]||{}).join(', ')+'). Check the sheet has Date, Line, Part No, Stage, Loading Qty, Total Inspection Qty, OK Part Qty, Not OK Part Qty, Defect columns.';return}
  ROWS=rows;setFilters();
  let auto=false;
  if(!USER_DATE&&fDate.value!=='all'&&!compute().cur.length){fDate.value='all';auto=true}
  render();
  if(auto){const ks=ROWS.map(r=>r.DateKey).sort();note.textContent+=' · No records in the selected range, so showing all data ('+ROWS.length+' rows, '+dlab(ks[0])+' to '+dlab(ks[ks.length-1])+')'}
}
let CSV_LIVE=(()=>{try{return localStorage.getItem('csvurl')||''}catch(e){return ''}})()||CSV_URL,timer=null;   // a link saved with Connect Sheet overrides CSV_URL
function csvUrl(u){
  u=u.trim();const m=u.match(/spreadsheets\/d\/([^\/?#]+)/);
  if(m&&m[1]!=='e'){const gid=(u.match(/gid=(\d+)/)||[])[1];return 'https://docs.google.com/spreadsheets/d/'+m[1]+'/gviz/tq?tqx=out:csv'+(gid?'&gid='+gid:'')}
  return u;
}
/* Google's published CSV blocks browsers whose origin is "null" (a file opened from the phone / a local file).
   Try the direct link first, then fall back to CORS relays so it also works when opened locally. */
async function fetchCsv(u){
  const t=u+(u.includes('?')?'&':'?')+'t='+Date.now();
  const tries=[t,'https://corsproxy.io/?url='+encodeURIComponent(t),'https://api.allorigins.win/raw?url='+encodeURIComponent(t)];
  let err=new Error('unknown error');
  for(const x of tries){
    try{
      const r=await fetch(x);
      if(!r.ok){err=new Error('HTTP '+r.status+' (is the sheet published / shared?)');continue}
      const tx=await r.text();
      if(!tx.trim()||/^\s*<(!doctype|html)/i.test(tx)){err=new Error('Did not receive CSV - publish the sheet as CSV');continue}
      return tx;
    }catch(e){err=e}
  }
  throw err;
}
async function refreshNow(){
  if(!CSV_LIVE){render();return}
  if(!ROWS.length)note.textContent='Loading live data…';
  try{
    const wb=XLSX.read(await fetchCsv(csvUrl(CSV_LIVE)),{type:'string',raw:true});
    load(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}));
  }catch(e){note.textContent='Could not read the sheet: '+e.message}
}
function startLive(){clearInterval(timer);if(CSV_LIVE){refreshNow();timer=setInterval(refreshNow,REFRESH_SECONDS*1000)}}

function connectSheet(){
  const v=prompt('Paste your Google Sheet published CSV link (leave empty to use the default link):',CSV_LIVE);
  if(v===null)return;
  const u=v.trim();
  if(u&&!/^https?:\/\//i.test(u)){alert('Please paste a full link starting with https://');return}
  CSV_LIVE=u||CSV_URL;
  try{if(u)localStorage.setItem('csvurl',u);else localStorage.removeItem('csvurl')}catch(e){}
  USER_DATE=false;note.textContent='Loading live data…';
  startLive();
}

function showLogo(src){const el=$('logo');el.innerHTML=src?'<img alt="logo" src="'+src+'">':'🎨'}
try{showLogo(LOGO_SRC||localStorage.getItem('logo'))}catch(e){showLogo(LOGO_SRC)}
$('logoF').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const h=120,w=Math.round(im.width*h/im.height),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);

/* ================= EVENTS ================= */
(()=>{const t=new Date(),f=new Date(t.getFullYear(),t.getMonth(),1);$('dFrom').value=localKey(f);$('dTo').value=localKey(t)})();
fDate.onchange=()=>{USER_DATE=true;$('cust').style.display=fDate.value==='custom'?'flex':'none';render()};
$('dFrom').onchange=$('dTo').onchange=render;
[fShift,fModel,fLine].forEach(e=>e.onchange=render);
$('side').onclick=e=>{const b=e.target.closest('button');if(!b)return;page=b.dataset.p;
  document.querySelectorAll('#side button').forEach(x=>x.classList.toggle('on',x===b));render()};
$('f').onchange=async e=>{const file=e.target.files[0];if(!file)return;
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});load(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))};

setFilters();render();startLive();
</script>
