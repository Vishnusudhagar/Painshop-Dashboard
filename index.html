<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Baxy Paintshop Report</title>
    <meta name="description" content="Industrial paintshop production tracking, quality KPIs, defect pareto analysis, and real-time Google Sheets synchronization." />
    
    <!-- Android & PWA App Capabilities -->
    <meta name="theme-color" content="#0a1a46" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Baxy Paint" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Baxy Paint" />
    
    <!-- OpenGraph & Social Cards -->
    <meta property="og:title" content="Baxy Paintshop Report" />
    <meta property="og:description" content="Industrial paintshop production tracking, quality KPIs, defect pareto analysis, and real-time Google Sheets synchronization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Gracefully handle benign Vite HMR WebSocket errors in AI Studio iframe preview environment
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) || (e && e.error && e.error.message) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('closed without opened'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('closed without opened'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      var prevOnError = window.onerror;
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        var str = typeof msg === 'string' ? msg : (error && error.message) || '';
        if (str && (str.includes('WebSocket') || str.includes('closed without opened'))) {
          return true;
        }
        if (typeof prevOnError === 'function') {
          return prevOnError.apply(this, arguments);
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
